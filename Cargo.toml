[workspace]
resolver = "2"
members = [
    "crates/cortical-shared",
    "crates/thalamus",
    "crates/prefrontal-cortex",
    "crates/hippocampus",
    "crates/basal-ganglia",
    "crates/cerebellum",
    "crates/amygdala",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Zac Elston"]
license = "MIT"
repository = "https://github.com/zacharyelston/neurostack"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }

# Vector store
qdrant-client = "1.7"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
config = "0.14"
dotenvy = "0.15"

# Testing
tokio-test = "0.4"

# Internal crates
cortical-shared = { path = "crates/cortical-shared" }
